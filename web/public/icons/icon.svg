<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonZ" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="#09090b" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#27272a" stroke-width="2" />
  <circle cx="256" cy="256" r="220" fill="url(#bgGlow)" />

  <!-- Outer Tech Hexagon / Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1f2937" stroke-width="4" stroke-dasharray="16 12" />

  <!-- MindZed Glowing Emblem: Stylized M and Z fusion -->
  <g filter="url(#glow)">
    <!-- M shape left -->
    <path d="M 140 340 L 140 180 L 210 270 L 256 210 L 302 270 L 372 180 L 372 340" 
          fill="none" 
          stroke="url(#cyberGrad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Core Z energy slash -->
    <path d="M 180 200 L 332 200 L 180 320 L 332 320" 
          fill="none" 
          stroke="url(#neonZ)" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.85" />

    <!-- Pulse nodes -->
    <circle cx="256" cy="210" r="10" fill="#22d3ee" />
    <circle cx="140" cy="180" r="10" fill="#34d399" />
    <circle cx="372" cy="180" r="10" fill="#3b82f6" />
  </g>
</svg>
